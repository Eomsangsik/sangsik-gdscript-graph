name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # A plain (non-editable) install resolves dependencies the way a user's
      # fresh install does -- the newest releases pyproject.toml allows.
      - run: python -m pip install . pytest
      - run: python -m pytest -q

  oldest-dependencies:
    name: test (oldest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install . pytest "mcp==1.14.0" "gdtoolkit==4.5.0" "watchdog==4.0.0"
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # The built wheel alone, in a clean environment, must be able to start
      # the MCP server -- the failure mode an unpinned dependency once caused.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import gdscript_graph.mcp_server"
          /tmp/smoke/bin/gdscript-graph --help
